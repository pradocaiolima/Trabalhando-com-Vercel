<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PRADO Cars | Showroom de Superesportivos{% endblock %}</title>
    
    <!-- Fontes Orbitron e Inter para estética de alta performance -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #030305;
            --bg-card: #0a0a0f;
            --bg-card-hover: #111118;
            --border-card: #1f1f2e;
            --border-hover: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #8888a0;
            
            /* Nova Identidade: Azul Turbo */
            --blue-primary: #3b82f6;
            --blue-glow: rgba(59, 130, 246, 0.4);
            --blue-gradient: linear-gradient(135deg, #60a5fa 0%, #1d4ed8 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-base);
            /* Textura de pista com reflexos em azul turbo */
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.08) 0%, transparent 60%),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.01) 0, rgba(255, 255, 255, 0.01) 1px, transparent 0, transparent 40px);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            animation: fadeInPage 0.5s ease forwards;
        }

        @keyframes fadeInPage {
            to { opacity: 1; }
        }

        /* Header / Navbar Estilo Showroom */
        header {
            background-color: rgba(3, 3, 5, 0.92);
            border-bottom: 1px solid rgba(59, 130, 246, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(15px);
            padding: 20px 50px;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-style: italic;
            color: #ffffff;
            text-shadow: 0 0 20px var(--blue-glow);
            transition: transform 0.3s ease;
        }

        .brand-title span {
            color: var(--blue-primary);
        }

        .brand-logo:hover .brand-title {
            transform: scale(1.03);
        }

        header nav {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        header nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
            position: relative;
        }

        header nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -6px;
            left: 0;
            background-color: var(--blue-primary);
            transition: width 0.3s ease;
        }

        header nav a:hover, header nav a.active {
            color: var(--text-main);
        }

        header nav a:hover::after, header nav a.active::after {
            width: 100%;
        }

        main {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 60px 30px;
            box-sizing: border-box;
            flex-grow: 1;
        }

        /* Grade de Veículos / Showroom */
        .grid-veiculos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 35px;
        }

        /* Cards Estilo Hipercar Showroom */
        .veiculo-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .veiculo-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 8px;
            border: 1px solid var(--blue-primary);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .veiculo-card:hover {
            transform: translateY(-8px);
            background-color: var(--bg-card-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(59, 130, 246, 0.15);
        }

        .veiculo-card:hover::after {
            opacity: 1;
        }

        .card-img-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            position: relative;
            background-color: #000;
        }

        .veiculo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .veiculo-card:hover img {
            transform: scale(1.08);
        }

        .card-body {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-body h3 {
            margin: 0 0 8px 0;
            font-size: 1.4rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .card-body p {
            color: var(--text-muted);
            margin: 0 0 20px 0;
            font-size: 0.9rem;
        }

        .detalhe-img {
            width: 100%;
            max-height: 550px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border-card);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            margin-bottom: 35px;
        }

        /* Botões com gradiente Azul Turbo */
        .btn {
            display: inline-block;
            background: var(--blue-gradient);
            color: #ffffff;
            padding: 14px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            margin-top: auto;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #ffffff;
            color: #000000;
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
        }

        .btn-secundario {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-main);
            box-shadow: none;
        }

        .btn-secundario:hover {
            background: var(--text-main);
            color: #000000;
            border-color: var(--text-main);
        }

        footer {
            background-color: #020203;
            border-top: 1px solid var(--border-card);
            padding: 40px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="brand-logo">
                <span class="brand-title">PRADO <span>CARS</span></span>
            </a>

            <nav>
                <a href="/">Início</a>
                <a href="/veiculos">Showroom</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 PRADO CARS. Exclusividade e Performance Absoluta.</p>
    </footer>
</body>
</html>
